<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>今日の運勢 MVP</title>
    <meta
      name="description"
      content="1日1回だけ占える、総合運・仕事運・恋愛運・金運をまとめて見られる日本語の占いアプリMVP。"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-labelledby="app-title">
        <div class="topbar">
          <div>
            <p class="eyebrow">DARI Ventures MVP</p>
            <h1 id="app-title">今日の運勢</h1>
          </div>
          <div class="countdown-pill" aria-live="polite">
            <span>次の占い</span>
            <strong id="countdownText">--:--:--</strong>
          </div>
        </div>

        <form class="control-panel" id="fortuneForm">
          <label for="nameInput">名前・ニックネーム</label>
          <div class="input-row">
            <input id="nameInput" name="name" type="text" maxlength="32" placeholder="例: だり" autocomplete="name" />
            <button id="drawButton" type="submit">今日の運勢を見る</button>
          </div>
          <p class="form-note" id="formNote">占えるのは1日1回。結果は明日まで保存されます。</p>
        </form>

        <article class="fortune-card" aria-live="polite">
          <div class="date-line" id="dateLine"></div>
          <div class="score-row">
            <div class="score-ring" aria-label="総合スコア">
              <span id="scoreValue">--</span>
            </div>
            <div>
              <p class="category" id="categoryText">今日</p>
              <h2 id="fortuneTitle">名前を入れて、今日の運勢を占いましょう。</h2>
            </div>
          </div>
          <p class="fortune-copy" id="fortuneCopy">
            総合運、仕事運、恋愛運、金運をまとめて確認できます。
          </p>

          <div class="detail-grid">
            <div>
              <span>ラッキーカラー</span>
              <strong id="colorText">-</strong>
            </div>
            <div>
              <span>ラッキーナンバー</span>
              <strong id="numberText">-</strong>
            </div>
            <div>
              <span>今日の行動</span>
              <strong id="actionText">-</strong>
            </div>
          </div>

          <div class="result-list" id="resultList">
            <section class="result-card">
              <span>総合運</span>
              <h3 id="generalTitle">未鑑定</h3>
              <p id="generalCopy">占うとここに結果が表示されます。</p>
            </section>
            <section class="result-card">
              <span>仕事運</span>
              <h3 id="workTitle">未鑑定</h3>
              <p id="workCopy">占うとここに結果が表示されます。</p>
            </section>
            <section class="result-card">
              <span>恋愛運</span>
              <h3 id="loveTitle">未鑑定</h3>
              <p id="loveCopy">占うとここに結果が表示されます。</p>
            </section>
            <section class="result-card">
              <span>金運</span>
              <h3 id="moneyTitle">未鑑定</h3>
              <p id="moneyCopy">占うとここに結果が表示されます。</p>
            </section>
          </div>

          <div class="actions">
            <button id="copyButton" type="button">コピー</button>
            <button id="shareButton" type="button">シェア</button>
          </div>
        </article>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
